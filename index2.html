<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        header { background: #111; padding: 20px; text-align: center; border-bottom: 3px solid #e50914; }
        .logo { color: #e50914; font-size: 35px; font-weight: bold; }
        nav { background: #1a1a1a; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-size: 14px; }
        .container { max-width: 1000px; margin: 20px auto; padding: 10px; }
        .player { position: relative; padding-bottom: 56.25%; height: 0; background: #111; border: 2px solid #333; }
        .player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #141414; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .btn { background: #e50914; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header><div class="logo">MOVIE HUB</div></header>
<nav>
    <a href="#">HOME</a> <a href="#">LANGUAGE</a> <a href="#">COUNTRY</a> <a href="#">TV SERIES</a> <a href="#">MOVIE</a>
</nav>

<div class="container">
    <div class="player">
        <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <h2 style="border-left: 4px solid #e50914; padding-left: 10px;">LATEST MOVIES</h2>
    <div id="displayGrid" class="grid"></div>
</div>

<script>
    function load() {
        let movies = JSON.parse(localStorage.getItem('movies') || "[]");
        let grid = document.getElementById('displayGrid');
        grid.innerHTML = "";

        if(movies.length === 0) {
            grid.innerHTML = "<p>No movies found. Add from Admin Panel.</p>";
            return;
        }

        movies.forEach(m => {
            let card = document.createElement('div');
            card.className = "card";
            card.innerHTML = `<h3>${m.name}</h3><button class="btn" onclick="play('${m.url}')">WATCH NOW</button>`;
            grid.appendChild(card);
        });

        // මුලින්ම තියෙන වීඩියෝ එක ප්ලේයර් එකට දාන්න
        if(movies.length > 0) document.getElementById('videoPlayer').src = movies[0].url;
    }

    function play(url) {
        document.getElementById('videoPlayer').src = url;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    window.onload = load;
</script>

</body>
</html>
